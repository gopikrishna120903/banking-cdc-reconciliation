[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "banking_cdc"
version = "1.0.0"
description = "Incremental CDC loads and reconciliation for banking transactions"
requires-python = ">=3.10"
dependencies = ["pyspark>=3.5", "delta-spark>=3.2"]

[project.scripts]
run-cdc = "banking_cdc.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
